<!DOCTYPE html>
<html lang="en" data-season="winter" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#4A90A4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spiritual Seasons">
  <meta name="description" content="A 120-day devotional journey through Winter, Spring, Summer, and Autumn. Discover your spiritual season and grow in faith.">
  <title>Spiritual Seasons | Daily Devotional</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .splash-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,#E3F2FD 0%,#FFF8F0 100%);transition:opacity .5s ease-out}
    .splash-screen.fade-out{opacity:0;pointer-events:none}
    .splash-logo{width:120px;height:120px;border-radius:24px;box-shadow:0 20px 40px rgba(74,144,164,.3);animation:pulse 2s ease-in-out infinite}
    .splash-title{margin-top:24px;font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:600;color:#2C3E50}
    .splash-subtitle{margin-top:8px;font-family:'Source Sans 3',sans-serif;font-size:14px;color:#5D6D7E}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  </style>
</head>
<body>
  <div class="splash-screen" id="splash" aria-hidden="true">
    <img src="assets/icons/icon.svg" alt="" class="splash-logo" id="splash-logo">
    <h1 class="splash-title">Spiritual Seasons</h1>
    <p class="splash-subtitle">Daily Devotional Workbook</p>
  </div>

  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;padding:20px;text-align:center;">
      <h1>JavaScript Required</h1>
      <p>Please enable JavaScript to use the Spiritual Seasons devotional app.</p>
    </div>
  </noscript>

  <!--
    App shell: a single in-flow column (header / main / bottom nav).
    Nothing here is position:fixed, so content can never slide under chrome
    and no "clearance padding" hacks are needed. <main> is the one scroll container.
  -->
  <div class="app-shell">
    <header class="app-header">
      <div class="season-accent-bar" aria-hidden="true"></div>
      <div class="header-content">
        <button class="header-title" data-route="home" aria-label="Spiritual Seasons home">
          <img src="assets/icons/icon.svg" alt="" class="header-logo" id="header-logo">
          <span>Spiritual Seasons</span>
        </button>
        <div class="header-actions">
          <button class="btn-icon" data-route="search" aria-label="Search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <button class="btn-icon" data-route="settings" aria-label="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main" id="app-main">
      <div id="page" class="page" aria-live="polite"></div>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <div class="bottom-nav-content" id="bottom-nav">
        <button class="nav-item" data-route="home" aria-label="Home">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-route="devotional" aria-label="Read">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
          <span>Read</span>
        </button>
        <button class="nav-item" data-route="contents" aria-label="Contents">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
          <span>Contents</span>
        </button>
        <button class="nav-item" data-route="progress" aria-label="Progress">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span>Progress</span>
        </button>
        <button class="nav-item" data-route="settings" aria-label="Settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
